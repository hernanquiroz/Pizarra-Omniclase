<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1115">
<title>Pizarra OmniClase · Profesor por Voz</title>
<style>
  :root{
    --bg:#fff; --fg:#111; --panel:rgba(255,255,255,.94);
    --border:rgba(0,0,0,.08); --accent:#007aff; --ok:#34c759; --ko:#ff3b30;
    --warn:#ff9500; --shadow:0 6px 24px rgba(0,0,0,.12);
    --fs-ui:clamp(12px,1.1vw + .3vh,20px);
    --fs-small:clamp(10px,.9vw + .2vh,16px);
    --fs-btn:clamp(14px,1.4vw + .4vh,26px);
    --pad-ui:clamp(4px,.5vw + .3vh,14px);
    --gap-ui:clamp(3px,.4vw + .2vh,10px);
    --radius:clamp(8px,.7vw + .4vh,18px);
    --btn-min:clamp(30px,3vw + 1.4vh,56px);
    --safe-t:env(safe-area-inset-top,0px);
    --safe-b:env(safe-area-inset-bottom,0px);
    --safe-l:env(safe-area-inset-left,0px);
    --safe-r:env(safe-area-inset-right,0px);
  }
  body.dark{--bg:#0f1115;--fg:#f2f2f2;--panel:rgba(26,29,36,.94);--border:rgba(255,255,255,.12);--shadow:0 6px 24px rgba(0,0,0,.5);}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;width:100%;overflow:hidden;overscroll-behavior:none;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:var(--fs-ui);background:var(--bg);color:var(--fg);-webkit-text-size-adjust:100%;text-size-adjust:100%;}
  canvas{display:block;position:fixed;inset:0;touch-action:none;cursor:crosshair;}
  #toolbar{position:fixed;top:calc(6px + var(--safe-t));left:calc(6px + var(--safe-l));right:calc(6px + var(--safe-r));z-index:20;display:flex;flex-wrap:wrap;gap:var(--gap-ui);align-items:center;background:var(--panel);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);padding:var(--pad-ui);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border);max-height:calc(100vh - 20px);overflow-y:auto;}
  #toolbar.collapsed{transform:translateY(calc(-100% - var(--safe-t) - 6px));opacity:0;pointer-events:none;}
  #toolbar .group{display:flex;gap:calc(var(--gap-ui)*.7);align-items:center;padding-right:var(--gap-ui);border-right:1px solid var(--border);flex-wrap:wrap;}
  #toolbar .group:last-child{border-right:none;padding-right:0;}
  button,select,input[type="text"]{font:inherit;font-size:var(--fs-btn);min-width:var(--btn-min);min-height:var(--btn-min);padding:calc(var(--pad-ui)*.7) calc(var(--pad-ui)*1.1);border:1px solid var(--border);border-radius:calc(var(--radius)*.7);background:transparent;color:var(--fg);cursor:pointer;touch-action:manipulation;line-height:1;transition:background .15s,transform .1s;display:inline-flex;align-items:center;justify-content:center;}
  button:active{transform:scale(.94);}
  button:hover,select:hover{background:rgba(127,127,127,.12);}
  button.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  input[type="color"]{width:var(--btn-min);height:var(--btn-min);padding:2px;border:none;background:none;cursor:pointer;}
  input[type="range"]{width:clamp(60px,8vw,180px);accent-color:var(--accent);min-height:var(--btn-min);}
  .palette{display:flex;gap:calc(var(--gap-ui)*.5);flex-wrap:wrap;}
  .swatch{width:calc(var(--btn-min)*.55);height:calc(var(--btn-min)*.55);border-radius:50%;border:2px solid transparent;cursor:pointer;}
  .swatch.sel{border-color:var(--fg);}
  #menuToggle{position:fixed;top:calc(8px + var(--safe-t));right:calc(8px + var(--safe-r));z-index:25;background:var(--panel);border:1px solid var(--border);border-radius:calc(var(--radius)*.8);width:var(--btn-min);height:var(--btn-min);display:none;align-items:center;justify-content:center;box-shadow:var(--shadow);font-size:var(--fs-btn);}
  #status{position:fixed;bottom:calc(8px + var(--safe-b));left:calc(8px + var(--safe-l));z-index:20;background:var(--panel);padding:calc(var(--pad-ui)*.6) calc(var(--pad-ui)*1.1);border-radius:calc(var(--radius)*.7);font-size:var(--fs-small);opacity:.85;pointer-events:none;border:1px solid var(--border);max-width:60vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  /* ============== PANEL IDIOMAS ============== */
  #langPanel{position:fixed;top:calc(70px + var(--safe-t));right:calc(10px + var(--safe-r));width:min(400px,92vw);max-height:calc(100vh - 90px - var(--safe-b));background:var(--panel);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border);z-index:30;display:flex;flex-direction:column;overflow:hidden;transform:translateX(110%);transition:transform .3s cubic-bezier(.2,.8,.2,1);}
  #langPanel.open{transform:translateX(0);}
  #langPanel .lp-head{display:flex;justify-content:space-between;align-items:center;padding:calc(var(--pad-ui)*1.2) calc(var(--pad-ui)*1.4);border-bottom:1px solid var(--border);}
  #langPanel .lp-head h3{font-size:var(--fs-ui);}
  #langPanel .lp-head button{min-width:auto;min-height:auto;padding:4px 10px;font-size:var(--fs-btn);}
  #langPanel .lp-langs{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:calc(var(--pad-ui)) calc(var(--pad-ui)*1.4);border-bottom:1px solid var(--border);}
  #langPanel .lp-langs label{display:flex;flex-direction:column;gap:4px;font-size:var(--fs-small);opacity:.75;}
  #langPanel .lp-langs select{min-width:auto;min-height:auto;padding:6px 8px;font-size:var(--fs-small);background:rgba(127,127,127,.08);}
  #langPanel .lp-tabs{display:flex;gap:2px;padding:6px calc(var(--pad-ui)*1.4);border-bottom:1px solid var(--border);overflow-x:auto;}
  #langPanel .lp-tabs button{min-width:auto;min-height:auto;padding:8px 12px;font-size:var(--fs-small);border-radius:8px;white-space:nowrap;}
  #langPanel .lp-body{padding:calc(var(--pad-ui)*1.2) calc(var(--pad-ui)*1.4);overflow-y:auto;flex:1;}
  #langPanel .lp-progress{padding:8px calc(var(--pad-ui)*1.4);border-top:1px solid var(--border);font-size:var(--fs-small);opacity:.75;display:flex;justify-content:space-between;}
  #langPanel .cat-list{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px;}
  #langPanel .cat-list button{min-width:auto;min-height:auto;padding:6px 10px;font-size:var(--fs-small);border-radius:20px;}
  #langPanel .vocab-list{display:flex;flex-direction:column;gap:6px;}
  #langPanel .v-item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:rgba(127,127,127,.07);border:1px solid var(--border);}
  #langPanel .v-text{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1;}
  #langPanel .v-src{font-size:var(--fs-small);opacity:.65;}
  #langPanel .v-tgt{font-size:var(--fs-ui);font-weight:600;word-break:break-word;}
  #langPanel .v-actions{display:flex;gap:4px;}
  #langPanel .v-actions button{min-width:auto;min-height:auto;padding:6px 8px;font-size:var(--fs-btn);}
  #langPanel .verb-table{width:100%;border-collapse:collapse;font-size:var(--fs-small);margin-top:8px;}
  #langPanel .verb-table th,#langPanel .verb-table td{padding:5px 6px;border-bottom:1px solid var(--border);text-align:left;}
  #langPanel h4.section{font-size:var(--fs-small);text-transform:uppercase;opacity:.6;margin:10px 0 6px;letter-spacing:.05em;}

  /* ============== PROFESOR ============== */
  #teacherBar{position:fixed;bottom:calc(10px + var(--safe-b));left:50%;transform:translateX(-50%) translateY(200%);z-index:45;width:min(780px,96vw);background:var(--panel);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:calc(var(--pad-ui)*1.3) calc(var(--pad-ui)*1.5);display:flex;flex-direction:column;gap:10px;transition:transform .35s cubic-bezier(.2,.8,.2,1);}
  #teacherBar.open{transform:translateX(-50%) translateY(0);}
  #teacherBar .tb-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  #teacherBar .tb-avatar{width:clamp(36px,3.5vw + 1vh,56px);height:clamp(36px,3.5vw + 1vh,56px);border-radius:50%;background:linear-gradient(135deg,var(--accent),#5856d6);display:flex;align-items:center;justify-content:center;font-size:clamp(18px,2vw + .5vh,28px);flex-shrink:0;transition:transform .2s;}
  #teacherBar .tb-avatar.talking{animation:pulse 1.2s infinite;}
  @keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(0,122,255,.5);}50%{transform:scale(1.06);box-shadow:0 0 0 12px rgba(0,122,255,0);}}
  #teacherBar .tb-info{display:flex;flex-direction:column;min-width:0;flex:1;}
  #teacherBar .tb-name{font-size:var(--fs-small);opacity:.65;text-transform:uppercase;letter-spacing:.05em;}
  #teacherBar .tb-status{font-size:var(--fs-ui);font-weight:600;}
  #teacherBar .tb-live{font-size:var(--fs-small);opacity:.85;padding:4px 10px;border-radius:20px;background:rgba(127,127,127,.12);display:flex;align-items:center;gap:6px;}
  #teacherBar .tb-live.rec{background:rgba(255,59,48,.18);color:var(--ko);}
  #teacherBar .tb-live.speak{background:rgba(0,122,255,.18);color:var(--accent);}
  #teacherBar .tb-live .dot{width:8px;height:8px;border-radius:50%;background:var(--ko);animation:blink .8s infinite;}
  @keyframes blink{50%{opacity:.2;}}

  #teacherBar .tb-question{background:rgba(0,122,255,.08);border:1px solid rgba(0,122,255,.25);border-radius:calc(var(--radius)*.8);padding:10px 14px;font-size:clamp(15px,1.5vw + .5vh,24px);line-height:1.4;font-weight:500;}
  #teacherBar .tb-question .q-lang{font-size:var(--fs-small);opacity:.6;display:block;margin-bottom:4px;text-transform:uppercase;}
  #teacherBar .tb-transcript{background:rgba(127,127,127,.08);border-radius:calc(var(--radius)*.8);padding:8px 12px;font-size:var(--fs-small);min-height:1.6em;font-style:italic;opacity:.85;}
  #teacherBar .tb-feedback{font-size:var(--fs-ui);font-weight:600;padding:6px 2px;display:none;}
  #teacherBar .tb-feedback.ok{color:var(--ok);display:block;}
  #teacherBar .tb-feedback.ko{color:var(--ko);display:block;}
  #teacherBar .tb-feedback.partial{color:var(--warn);display:block;}
  #teacherBar .tb-actions{display:flex;gap:6px;flex-wrap:wrap;}
  #teacherBar .tb-actions button{min-width:auto;min-height:auto;padding:8px 14px;font-size:var(--fs-small);border-radius:10px;}
  #teacherBar .tb-actions .primary{background:var(--accent);color:#fff;border-color:var(--accent);}
  #teacherBar .tb-actions .rec{background:var(--ko);color:#fff;border-color:var(--ko);}
  #teacherBar .tb-actions .ok{background:var(--ok);color:#fff;border-color:var(--ok);}
  #teacherBar .tb-actions .warn{background:var(--warn);color:#fff;border-color:var(--warn);}
  #teacherBar .tb-progress{font-size:var(--fs-small);opacity:.65;display:flex;gap:14px;flex-wrap:wrap;}
  #teacherBar .tb-manual{display:none;gap:6px;padding-top:4px;border-top:1px dashed var(--border);}
  #teacherBar .tb-manual.show{display:flex;flex-wrap:wrap;}

  @media (max-width:640px){
    #toolbar{gap:3px;padding:4px;}
    #toolbar .group{padding-right:3px;}
    .hide-xs{display:none !important;}
    #menuToggle{display:flex;}
    #toolbar{max-height:70vh;}
    #langPanel{top:auto;bottom:0;right:0;left:0;width:100vw;max-height:75vh;border-radius:16px 16px 0 0;transform:translateY(110%);}
    #langPanel.open{transform:translateY(0);}
    #teacherBar{bottom:0;left:0;right:0;width:100vw;border-radius:16px 16px 0 0;transform:translateY(110%);}
    #teacherBar.open{transform:translateY(0);}
  }
</style>
</head>
<body>
<canvas id="board"></canvas>
<button id="menuToggle">☰</button>

<div id="toolbar">
  <div class="group">
    <button id="t-pen" class="active" title="Lápiz">✏️</button>
    <button id="t-high" title="Resaltador">🖍️</button>
    <button id="t-eraser" title="Borrador">🧽</button>
    <button id="t-line" class="hide-xs">╱</button>
    <button id="t-rect" class="hide-xs">▭</button>
    <button id="t-circle" class="hide-xs">◯</button>
    <button id="t-arrow" class="hide-xs">→</button>
    <button id="t-text" title="Texto">T</button>
  </div>
  <div class="group">
    <input type="color" id="color" value="#111111">
    <div class="palette" id="palette"></div>
  </div>
  <div class="group">
    <input type="range" id="size" min="1" max="40" value="3">
    <span id="sizeLabel" style="font-size:var(--fs-small);opacity:.6;min-width:2em;text-align:center;">3</span>
  </div>
  <div class="group">
    <select id="bg">
      <option value="blank">En blanco</option>
      <option value="grid">Cuadrícula</option>
      <option value="lines">Líneas</option>
      <option value="dots">Puntos</option>
      <option value="graph">Milimétrico</option>
      <option value="music">Música</option>
    </select>
  </div>
  <div class="group">
    <button id="undo">↩️</button><button id="redo">↪️</button><button id="clear">🗑️</button>
  </div>
  <div class="group">
    <button id="prev">◀</button>
    <span id="pageLabel" style="font-size:var(--fs-small);min-width:3em;text-align:center;">1 / 1</span>
    <button id="next">▶</button><button id="addPage">＋</button>
  </div>
  <div class="group">
    <button id="openLang" title="Idiomas">🌍</button>
    <button id="openTeacher" title="Profesor por voz">🎓</button>
    <button id="save" title="PNG">💾</button>
    <button id="saveJson" class="hide-md">📁</button>
    <button id="loadJson" class="hide-md">📂</button>
    <button id="full">⛶</button>
    <button id="theme">🌗</button>
  </div>
</div>

<div id="status">Listo · Pizarra OmniClase</div>
<input type="file" id="fileInput" accept=".json" style="display:none">

<div id="langPanel">
  <div class="lp-head"><h3>🌍 Aprender idiomas</h3><button id="lpClose">✕</button></div>
  <div class="lp-langs">
    <label>Idioma base<select id="langSource"></select></label>
    <label>Aprender<select id="langTarget"></select></label>
  </div>
  <div class="lp-tabs" id="lpTabs">
    <button data-tab="vocab" class="active">Vocabulario</button>
    <button data-tab="phrases">Frases</button>
    <button data-tab="verbos">Verbos</button>
  </div>
  <div class="lp-body" id="lpBody"></div>
  <div class="lp-progress">
    <span>✅ <b id="lpOK">0</b></span>
    <span>❌ <b id="lpKO">0</b></span>
    <span>📖 <b id="lpSeen">0</b></span>
  </div>
</div>

<div id="teacherBar">
  <div class="tb-head">
    <div class="tb-avatar" id="tbAvatar">👩‍🏫</div>
    <div class="tb-info">
      <span class="tb-name">Profesora OmniClase</span>
      <span class="tb-status" id="tbStatus">Lista para empezar</span>
    </div>
    <div class="tb-live" id="tbLive">💤 En espera</div>
  </div>

  <div class="tb-question">
    <span class="q-lang" id="tbQLang">Pregunta</span>
    <span id="tbQuestion">Presiona "Comenzar clase" para empezar.</span>
  </div>

  <div class="tb-transcript" id="tbTranscript">Aquí verás lo que el profe escucha…</div>
  <div class="tb-feedback" id="tbFeedback"></div>

  <div class="tb-progress">
    <span>🏆 Aciertos: <b id="tbOK">0</b></span>
    <span>💪 A mejorar: <b id="tbKO">0</b></span>
    <span>📊 Ronda: <b id="tbRound">0</b>/10</span>
  </div>

  <div class="tb-actions">
    <button id="tbStart" class="primary">▶ Comenzar clase</button>
    <button id="tbRepeat">🔁 Repetir</button>
    <button id="tbMic" class="rec" disabled>🎤 Hablar</button>
    <button id="tbReveal" disabled>👁 Ver</button>
    <button id="tbSkip" disabled>⏭ Siguiente</button>
    <button id="tbStop" disabled>✕ Detener</button>
  </div>

  <div class="tb-manual" id="tbManual">
    <span style="font-size:var(--fs-small);opacity:.7;align-self:center">Si el micro falla, evalúa tú:</span>
    <button id="tbManualOK" class="ok">✓ Lo dije bien</button>
    <button id="tbManualKO" class="warn">✗ Lo dije mal</button>
  </div>
</div>

<script>
(function(){
'use strict';

/* ==================== PIZARRA ==================== */
const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const sizeLabel = document.getElementById('sizeLabel');
const pageLabel = document.getElementById('pageLabel');
const toolbar = document.getElementById('toolbar');
const menuToggle = document.getElementById('menuToggle');

let dpr = window.devicePixelRatio || 1, W = 0, H = 0;
function newPage(){ return { strokes: [], bg: 'blank' }; }
const state = { tool:'pen', color:'#111111', size:3, bg:'blank', dark:false, pages:[newPage()], pageIndex:0, undoStack:[], redoStack:[] };
function current(){ return state.pages[state.pageIndex]; }

let resizeTimer = null;
function resize(){
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(()=>{
    dpr = window.devicePixelRatio || 1;
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.floor(W*dpr); canvas.height = Math.floor(H*dpr);
    canvas.style.width = W+'px'; canvas.style.height = H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0); redraw();
  }, 80);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', ()=>setTimeout(resize,200));

function drawBackground(){
  ctx.save();
  ctx.fillStyle = state.dark ? '#0f1115' : '#ffffff';
  ctx.fillRect(0,0,W,H);
  ctx.strokeStyle = state.dark ? 'rgba(255,255,255,.08)' : 'rgba(0,0,0,.08)';
  ctx.fillStyle   = state.dark ? 'rgba(255,255,255,.18)' : 'rgba(0,0,0,.18)';
  ctx.lineWidth = 1;
  const base = Math.max(24, Math.min(W,H)/28);
  const bg = state.bg;
  if (bg === 'grid'){ for (let x=0;x<W;x+=base){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();} for (let y=0;y<H;y+=base){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();} }
  else if (bg === 'lines'){ for (let y=base;y<H;y+=base){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();} }
  else if (bg === 'dots'){ for (let x=base;x<W;x+=base) for (let y=base;y<H;y+=base){ctx.beginPath();ctx.arc(x,y,1.2,0,Math.PI*2);ctx.fill();} }
  else if (bg === 'graph'){ const s=base/2; ctx.lineWidth=.6; for (let x=0;x<W;x+=s){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();} for (let y=0;y<H;y+=s){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();} ctx.lineWidth=1.2; for (let x=0;x<W;x+=base*5){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();} for (let y=0;y<H;y+=base*5){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();} }
  else if (bg === 'music'){ const gap=base*.9; for (let i=0;i<6;i++){ const y=H*.25+i*gap; ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke(); } }
  ctx.restore();
}
function applyStyle(s){
  ctx.lineCap='round'; ctx.lineJoin='round';
  const factor = Math.max(.5, Math.min(W,H)/800); const lw = s.size*factor;
  if (s.tool==='eraser'){ctx.strokeStyle=state.dark?'#0f1115':'#ffffff';ctx.lineWidth=lw*3;ctx.globalAlpha=1;}
  else if (s.tool==='high'){ctx.strokeStyle=s.color;ctx.lineWidth=lw*4;ctx.globalAlpha=.35;}
  else {ctx.strokeStyle=s.color;ctx.lineWidth=lw;ctx.globalAlpha=1;}
}
function drawPath(s){ ctx.save();applyStyle(s);ctx.beginPath(); const p=s.points; if (p.length===1){ctx.arc(p[0].x,p[0].y,ctx.lineWidth/2,0,Math.PI*2);ctx.fillStyle=ctx.strokeStyle;ctx.fill();} else {ctx.moveTo(p[0].x,p[0].y); for (let i=1;i<p.length-1;i++){const mx=(p[i].x+p[i+1].x)/2,my=(p[i].y+p[i+1].y)/2;ctx.quadraticCurveTo(p[i].x,p[i].y,mx,my);} ctx.lineTo(p[p.length-1].x,p[p.length-1].y);ctx.stroke();} ctx.restore(); }
function drawLine(s){ctx.save();applyStyle(s);ctx.beginPath();ctx.moveTo(s.x0,s.y0);ctx.lineTo(s.x1,s.y1);ctx.stroke();ctx.restore();}
function drawRect(s){ctx.save();applyStyle(s);ctx.strokeRect(Math.min(s.x0,s.x1),Math.min(s.y0,s.y1),Math.abs(s.x1-s.x0),Math.abs(s.y1-s.y0));ctx.restore();}
function drawCircle(s){ctx.save();applyStyle(s);ctx.beginPath();ctx.ellipse((s.x0+s.x1)/2,(s.y0+s.y1)/2,Math.abs(s.x1-s.x0)/2,Math.abs(s.y1-s.y0)/2,0,0,Math.PI*2);ctx.stroke();ctx.restore();}
function drawArrow(s){ctx.save();applyStyle(s);const dx=s.x1-s.x0,dy=s.y1-s.y0,ang=Math.atan2(dy,dx),len=Math.hypot(dx,dy);const head=Math.min(ctx.lineWidth*6,len*.3);ctx.beginPath();ctx.moveTo(s.x0,s.y0);ctx.lineTo(s.x1,s.y1);ctx.stroke();ctx.beginPath();ctx.moveTo(s.x1,s.y1);ctx.lineTo(s.x1-head*Math.cos(ang-Math.PI/7),s.y1-head*Math.sin(ang-Math.PI/7));ctx.moveTo(s.x1,s.y1);ctx.lineTo(s.x1-head*Math.cos(ang+Math.PI/7),s.y1-head*Math.sin(ang+Math.PI/7));ctx.stroke();ctx.restore();}
function drawText(s){ctx.save();ctx.fillStyle=s.color;const fs=Math.max(14,s.size*8+12)*Math.max(.7,Math.min(W,H)/900);ctx.font='600 '+fs+'px system-ui, sans-serif';ctx.textBaseline='top';s.text.split('\n').forEach((ln,i)=>ctx.fillText(ln,s.x0,s.y0+i*fs*1.2));ctx.restore();}
function drawStroke(s){ if (s.type==='path') return drawPath(s); if (s.type==='line') return drawLine(s); if (s.type==='rect') return drawRect(s); if (s.type==='circle') return drawCircle(s); if (s.type==='arrow') return drawArrow(s); if (s.type==='text') return drawText(s); }
function redraw(){ drawBackground(); for (const st of current().strokes) drawStroke(st); }

let drawing=false, activePointer=null, penActive=false, tempStroke=null;
function getPos(e){ const r = canvas.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top, pressure:e.pressure||.5}; }
canvas.addEventListener('pointerdown', e=>{
  if (e.pointerType==='touch' && penActive) return;
  if (e.pointerType==='pen') penActive = true;
  if (activePointer!==null) return;
  e.preventDefault(); activePointer = e.pointerId;
  try{canvas.setPointerCapture(e.pointerId);}catch(_){}
  const p = getPos(e);
  const base = {tool:state.tool, color:state.color, size:state.size, pointerType:e.pointerType};
  if (state.tool==='text'){ const text = prompt('Texto:'); if (text && text.trim()) pushStroke({type:'text',x0:p.x,y0:p.y,text:text.trim(),color:state.color,size:state.size}); activePointer = null; return; }
  if (state.tool==='pen'||state.tool==='high'||state.tool==='eraser') tempStroke = {type:'path',...base,points:[p]};
  else tempStroke = {type:state.tool,...base,x0:p.x,y0:p.y,x1:p.x,y1:p.y};
  drawing = true;
}, {passive:false});
canvas.addEventListener('pointermove', e=>{
  if (!drawing || e.pointerId!==activePointer || !tempStroke) return;
  e.preventDefault(); const p = getPos(e);
  if (tempStroke.type==='path'){tempStroke.points.push(p);redraw();drawStroke(tempStroke);}
  else{tempStroke.x1=p.x;tempStroke.y1=p.y;redraw();drawStroke(tempStroke);}
}, {passive:false});
function endPointer(e){
  if (e.pointerId!==activePointer) return;
  if (e.pointerType==='pen') penActive = false;
  if (tempStroke && drawing){ if (tempStroke.type==='path' && tempStroke.points.length<2) tempStroke.points.push({...tempStroke.points[0]}); pushStroke(tempStroke); }
  drawing=false;activePointer=null;tempStroke=null;
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);

function pushStroke(stroke){ current().strokes.push(stroke); state.undoStack.push({page:state.pageIndex, action:'add', stroke}); state.redoStack = []; redraw(); autosave(); }
function undo(){ const last = state.undoStack.pop(); if (!last) return; if (last.action==='add'){ const pg = state.pages[last.page]; const i = pg.strokes.lastIndexOf(last.stroke); if (i>=0){pg.strokes.splice(i,1);state.redoStack.push({page:last.page,stroke:last.stroke,index:i});} } else if (last.action==='clear'){ state.pages[last.page].strokes = last.strokes; state.redoStack.push({page:last.page,action:'clear'}); } redraw(); autosave(); }
function redo(){ const last = state.redoStack.pop(); if (!last) return; if (last.stroke){ state.pages[last.page].strokes.splice(last.index,0,last.stroke); state.undoStack.push({page:last.page,action:'add',stroke:last.stroke}); } else if (last.action==='clear'){ const prev = state.pages[last.page].strokes; state.pages[last.page].strokes = []; state.undoStack.push({page:last.page,action:'clear',strokes:prev}); } redraw(); autosave(); }

tgtSel.addEventListener('change',e=>{ langState.target=e.target.value; renderTab(); });
lpTabs.addEventListener('click', e=>{ const btn = e.target.closest('button'); if (!btn) return; lpTabs.querySelectorAll('button').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); langState.activeTab=btn.dataset.tab; renderTab(); });

function renderTab(){ lpBody.innerHTML=''; if (langState.activeTab==='vocab') renderVocab(); else if (langState.activeTab==='phrases') renderPhrases(); else if (langState.activeTab==='verbos') renderVerbos(); refreshProgressUI(); }
function renderVocab(){
  const cats = Object.entries(VOCAB);
  lpBody.innerHTML = `<div class="cat-list">${cats.map(([k,v])=>`<button data-cat="${k}" class="${k===langState.activeCategory?'active':''}">${v.label}</button>`).join('')}</div><div class="vocab-list" id="vl"></div>`;
  lpBody.querySelector('.cat-list').addEventListener('click', e=>{ const btn = e.target.closest('button'); if (!btn) return; langState.activeCategory = btn.dataset.cat; renderVocab(); });
  const list = lpBody.querySelector('#vl');
  VOCAB[langState.activeCategory].items.forEach(it=>{
    const src = it[langState.source], tgt = it[langState.target];
    if (!src||!tgt) return;
    const el = document.createElement('div');
    el.className = 'v-item';
    el.innerHTML = `<div class="v-text"><span class="v-src">${src}</span><span class="v-tgt">${tgt}</span></div><div class="v-actions"><button data-act="speak">🔊</button></div>`;
    el.querySelector('[data-act="speak"]').addEventListener('click', ()=>{ speakSafe(tgt, langState.target); });
    list.appendChild(el);
  });
}
function renderPhrases(){
  const html = PHRASES.map((p,i)=>{ const src = p[langState.source], tgt = p[langState.target]; if (!src||!tgt) return ''; return `<div class="v-item" data-i="${i}"><div class="v-text"><span class="v-src">${src}</span><span class="v-tgt">${tgt}</span></div><div class="v-actions"><button data-act="speak">🔊</button></div></div>`; }).join('');
  lpBody.innerHTML = `<h4 class="section">Frases útiles</h4><div class="vocab-list">${html}</div>`;
  lpBody.querySelectorAll('.v-item').forEach(el=>{ const p = PHRASES[+el.dataset.i]; el.querySelector('[data-act="speak"]').addEventListener('click', ()=>speakSafe(p[langState.target], langState.target)); });
}
function renderVerbos(){
  const v = VERB_TABLES[langState.activeVerb];
  const keys = ['es','en','fr','pt'];
  const head = keys.map(k=>`<th>${LANGS[k].flag}</th>`).join('');
  const rows = PRONOUNS.map((p,i)=>{ return `<tr><th>${p}</th>${keys.map(k=>`<td>${v[k][i]}</td>`).join('')}</tr>`; }).join('');
  const selectors = Object.entries(VERB_TABLES).map(([k,val])=>`<button data-verb="${k}" class="${k===langState.activeVerb?'active':''}">${val.label}</button>`).join('');
  lpBody.innerHTML = `<h4 class="section">Conjugación presente</h4><div class="cat-list" id="verbList">${selectors}</div><table class="verb-table"><thead><tr><th></th>${head}</tr></thead><tbody>${rows}</tbody></table>`;
  lpBody.querySelector('#verbList').addEventListener('click', e=>{ const btn = e.target.closest('button'); if (!btn) return; langState.activeVerb = btn.dataset.verb; renderVerbos(); });
}

/* ==================== VOZ (robusta) ==================== */
let voicesCache = [];
function refreshVoices(){ if ('speechSynthesis' in window) voicesCache = speechSynthesis.getVoices(); }
if ('speechSynthesis' in window){ refreshVoices(); speechSynthesis.onvoiceschanged = refreshVoices; }

/* Hablar: devuelve Promesa que SIEMPRE resuelve (por onend, onerror o timeout) */
function speakSafe(text, lang){
  return new Promise(resolve=>{
    if (!('speechSynthesis' in window)){ resolve(); return; }
    try { speechSynthesis.cancel(); } catch(_){}
    const u = new SpeechSynthesisUtterance(text);
    u.lang = LANGS[lang]?.voice || 'es-ES';
    u.rate = .9; u.pitch = 1.05;
    const v = voicesCache.find(vv => vv.lang.toLowerCase().startsWith(lang));
    if (v) u.voice = v;
    let done = false;
    const fin = () => { if (done) return; done = true; clearTimeout(fallback); resolve(); };
    u.onend = fin; u.onerror = fin;
    const fallback = setTimeout(fin, Math.max(2500, text.length * 110) + 2000);
    try { speechSynthesis.speak(u); } catch(e){ fin(); }
  });
}
function stopSpeaking(){ try{ speechSynthesis.cancel(); }catch(_){} }

/* ==================== PROFESOR ==================== */
const teacherBar = document.getElementById('teacherBar');
const tbAvatar = document.getElementById('tbAvatar');
const tbStatus = document.getElementById('tbStatus');
const tbLive = document.getElementById('tbLive');
const tbQLang = document.getElementById('tbQLang');
const tbQuestion = document.getElementById('tbQuestion');
const tbTranscript = document.getElementById('tbTranscript');
const tbFeedback = document.getElementById('tbFeedback');
const tbOK = document.getElementById('tbOK');
const tbKO = document.getElementById('tbKO');
const tbRound = document.getElementById('tbRound');
const tbManual = document.getElementById('tbManual');
const btnStart = document.getElementById('tbStart');
const btnRepeat = document.getElementById('tbRepeat');
const btnMic = document.getElementById('tbMic');
const btnReveal = document.getElementById('tbReveal');
const btnSkip = document.getElementById('tbSkip');
const btnStop = document.getElementById('tbStop');
const btnManualOK = document.getElementById('tbManualOK');
const btnManualKO = document.getElementById('tbManualKO');

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

const teacher = {
  active: false,
  current: null,
  round: 0,
  maxRound: 10,
  ok: 0,
  ko: 0,
  recognition: null,
  listening: false,
  state: 'idle', // idle | speaking | waiting | listening | evaluating | feedback
  timeouts: [],
  silenceTimer: null,
  micPermissionGranted: false
};

/* --- Utilidades de tiempo --- */
function later(fn, ms){ const t = setTimeout(fn, ms); teacher.timeouts.push(t); return t; }
function clearLater(){ teacher.timeouts.forEach(t => clearTimeout(t)); teacher.timeouts = []; if (teacher.silenceTimer){ clearTimeout(teacher.silenceTimer); teacher.silenceTimer = null; } }
function setLive(cls, txt){ tbLive.className = 'tb-live' + (cls?' '+cls:''); tbLive.innerHTML = (cls==='rec'?'<span class="dot"></span> ':'') + txt; }
function setStatus(txt){ tbStatus.textContent = txt; }

/* --- Normalizar y comparar --- */
function normalize(str){ return String(str).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[¿?¡!.,;:"'`´\-]/g,'').replace(/\s+/g,' ').trim(); }
function levenshtein(a,b){ if (a===b) return 0; if (!a.length) return b.length; if (!b.length) return a.length; const m=[]; for (let i=0;i<=b.length;i++) m[i]=[i]; for (let j=0;j<=a.length;j++) m[0][j]=j; for (let i=1;i<=b.length;i++) for (let j=1;j<=a.length;j++) m[i][j] = b[i-1]===a[j-1] ? m[i-1][j-1] : Math.min(m[i-1][j-1]+1,m[i][j-1]+1,m[i-1][j]+1); return m[b.length][a.length]; }
function similarity(a,b){ a=normalize(a); b=normalize(b); if (!a && !b) return 1; const d = levenshtein(a,b); const mx = Math.max(a.length,b.length); return mx===0?1:1-d/mx; }

/* --- Palabras --- */
function allWords(){ const a=[]; Object.values(VOCAB).forEach(c=>c.items.forEach(i=>a.push(i))); return a; }
function randomWord(){ const a=allWords(); return a[Math.floor(Math.random()*a.length)]; }

/* --- Construir pregunta --- */
function buildQuestion(){
  const src = langState.source, tgt = langState.target;
  const w = randomWord();
  const fromWord = w[src], toWord = w[tgt];
  if (!fromWord || !toWord || src === tgt) return buildQuestion();
  const types = ['traduce','pronuncia','repite'];
  const type = types[Math.floor(Math.random()*types.length)];
  if (type === 'traduce') return { type, promptText:`¿Cómo se dice "${fromWord}" en ${LANGS[tgt].name}?`, expectAnswer: toWord, answerLang: tgt };
  if (type === 'pronuncia') return { type, promptText:`Pronuncia esta palabra: "${toWord}"`, expectAnswer: toWord, answerLang: tgt };
  return { type:'repite', promptText:`Repite después de mí:`, expectAnswer: toWord, answerLang: tgt };
}

/* --- Pedir permiso de micrófono --- */
async function ensureMicPermission(){
  if (teacher.micPermissionGranted) return true;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    stream.getTracks().forEach(t=>t.stop());
    teacher.micPermissionGranted = true;
    return true;
  } catch(e){
    tbTranscript.textContent = '⚠️ Debes permitir el micrófono en tu navegador.';
    return false;
  }
}

/* --- Destruir reconocimiento previo --- */
function destroyRecognition(){
  if (teacher.recognition){
    try { teacher.recognition.onend = null; teacher.recognition.onresult = null; teacher.recognition.onerror = null; teacher.recognition.abort(); } catch(_){}
    teacher.recognition = null;
  }
  teacher.listening = false;
}

/* --- Iniciar reconocimiento --- */
function startListening(){
  if (!teacher.active || !SR) return;
  destroyRecognition();
  stopSpeaking(); // garantiza que la síntesis no bloquee el micrófono
  
  setLive('', '🎤 Preparando micrófono…');
  tbTranscript.textContent = 'Preparando micrófono…';
  tbManual.classList.add('show');
  teacher.state = 'listening';
  setStatus('🎤 Escuchando…');

  // Delay para que el sistema libere el canal de audio tras la síntesis
  later(()=>{
    if (!teacher.active){ return; }
    const rec = new SR();
    rec.lang = LANGS[langState.target].voice;
    rec.continuous = false;
    rec.interimResults = false;
    rec.maxAlternatives = 1;

    let gotResult = false;

    rec.onstart = () => {
      teacher.listening = true;
      setLive('rec', '🎤 Escuchando…');
      tbTranscript.textContent = '🎤 Di tu respuesta ahora…';
      setStatus('🎤 Escuchando…');
    };
    rec.onresult = (e) => {
      gotResult = true;
      const txt = (e.results[0][0].transcript || '').trim();
      if (!txt || !/[a-zA-ZÀ-ÿ]/.test(txt)) return;
      tbTranscript.textContent = `Escuché: "${txt}"`;
      evaluateAnswer(txt);
    };
    rec.onerror = (ev) => {
      if (ev.error === 'no-speech'){ tbTranscript.textContent = 'No escuché nada. Puedes intentar de nuevo con 🎤 o evaluarte tú con ✅/❌.'; }
      else if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed'){ tbTranscript.textContent = '⚠️ Permiso de micrófono denegado.'; }
      else if (ev.error === 'aborted'){ /* silencio */ }
      else { tbTranscript.textContent = 'Error de micro: ' + ev.error; }
    };
    rec.onend = () => {
      teacher.listening = false;
      setLive('', '🎤 Micrófono libre');
      if (!gotResult && teacher.active){
        tbTranscript.textContent = 'No capté respuesta. Pulsa 🎤 para reintentar, o evalúate con ✅/❌.';
      }
    };

    teacher.recognition = rec;
    try {
      rec.start();
      // Timeout de seguridad: 9s sin resultados
      teacher.silenceTimer = setTimeout(()=>{
        if (teacher.listening && !gotResult && teacher.recognition){
          try { teacher.recognition.stop(); } catch(_){}
        }
      }, 9000);
    } catch(e){
      teacher.listening = false;
      tbTranscript.textContent = 'No se pudo iniciar el micrófono: ' + e.message;
    }
  }, 700);
}

/* --- Detener reconocimiento --- */
function stopListening(){
  if (teacher.silenceTimer){ clearTimeout(teacher.silenceTimer); teacher.silenceTimer = null; }
  destroyRecognition();
  setLive('', '🎤 Micrófono libre');
}

/* --- Estado y botones --- */
function refreshTeacherUI(){ tbOK.textContent = teacher.ok; tbKO.textContent = teacher.ko; tbRound.textContent = teacher.round; }
function enableButtons(enabled){
  btnMic.disabled = !enabled;
  btnReveal.disabled = !enabled;
  btnSkip.disabled = !enabled;
}

/* --- Iniciar clase --- */
btnStart.addEventListener('click', async ()=>{
  if (!SR){
    alert('Tu navegador no soporta reconocimiento de voz.\nUsa Chrome o Edge en PC/Android.');
    return;
  }
  if (!('speechSynthesis' in window)){
    alert('Tu navegador no soporta síntesis de voz.');
    return;
  }
  const ok = await ensureMicPermission();
  if (!ok) return;
  teacher.active = true;
  teacher.round = 0; teacher.ok = 0; teacher.ko = 0;
  refreshTeacherUI();
  btnStart.disabled = true;
  enableButtons(true);
  btnStop.disabled = false;
  teacherBar.classList.add('open');
  tbManual.classList.remove('show');
  setStatus('Iniciando clase…');
  setLive('speak', '🔊 Profe hablando…');
  await speakSafe(`Hola, soy tu profesora de ${LANGS[langState.target].name}. Vamos a empezar.`, 'es');
  nextQuestion();
});

btnStop.addEventListener('click', ()=>{
  teacher.active = false;
  stopListening();
  stopSpeaking();
  clearLater();
  teacherBar.classList.remove('open');
  btnStart.disabled = false;
  enableButtons(false);
  btnStop.disabled = true;
  tbManual.classList.remove('show');
  setStatus('Clase terminada');
});

btnRepeat.addEventListener('click', async ()=>{
  if (!teacher.current || teacher.state === 'speaking') return;
  stopListening();
  setStatus('Repitiendo…');
  tbAvatar.classList.add('talking');
  setLive('speak', '🔊 Profe hablando…');
  await speakSafe(teacher.current.promptText, 'es');
  if (teacher.current.type === 'repite' || teacher.current.type === 'pronuncia'){
    await new Promise(r=>setTimeout(r,250));
    await speakSafe(teacher.current.expectAnswer, teacher.current.answerLang);
  }
  tbAvatar.classList.remove('talking');
  await new Promise(r=>setTimeout(r,350));
  startListening();
});

btnReveal.addEventListener('click', ()=>{
  if (!teacher.current) return;
  tbFeedback.className = 'tb-feedback';
  tbFeedback.textContent = '';
  tbTranscript.textContent = `Respuesta correcta: "${teacher.current.expectAnswer}"`;
  speakSafe(teacher.current.expectAnswer, teacher.current.answerLang);
});

btnSkip.addEventListener('click', ()=>{
  if (!teacher.current) return;
  teacher.ko++;
  refreshTeacherUI();
  nextQuestion();
});

btnMic.addEventListener('click', ()=>{
  if (!teacher.active) return;
  if (teacher.listening) stopListening();
  else startListening();
});

btnManualOK.addEventListener('click', ()=>{
  if (!teacher.current) return;
  teacher.ok++; refreshTeacherUI();
  tbFeedback.className = 'tb-feedback ok';
  tbFeedback.textContent = '✅ Marcado como correcto';
  advanceAfterFeedback();
});
btnManualKO.addEventListener('click', ()=>{
  if (!teacher.current) return;
  teacher.ko++; refreshTeacherUI();
  tbFeedback.className = 'tb-feedback ko';
  tbFeedback.textContent = '❌ Marcado para repetir';
  tbTranscript.textContent = `Respuesta correcta: "${teacher.current.expectAnswer}"`;
  speakSafe(teacher.current.expectAnswer, teacher.current.answerLang);
  advanceAfterFeedback();
});

function advanceAfterFeedback(){
  stopListening();
  later(()=>{ if (teacher.active) nextQuestion(); }, 2200);
}

/* --- Siguiente pregunta --- */
async function nextQuestion(){
  if (!teacher.active) return;
  if (teacher.round >= teacher.maxRound){ endClass(); return; }
  clearLater();
  stopListening();
  
  teacher.round++;
  refreshTeacherUI();
  teacher.current = buildQuestion();
  teacher.state = 'speaking';
  tbFeedback.className = 'tb-feedback';
  tbFeedback.textContent = '';
  tbTranscript.textContent = '…';
  tbQLang.textContent = LANGS[langState.target].name;
  tbQuestion.textContent = teacher.current.promptText;
  setStatus('Pregunta ' + teacher.round);
  tbAvatar.classList.add('talking');
  setLive('speak', '🔊 Profe hablando…');
  tbManual.classList.remove('show');

  // 1) Pregunta principal (siempre en español para que el alumno entienda la instrucción)
  await speakSafe(teacher.current.promptText, 'es');

  // 2) Si es repetición/pronunciación, la profe da el modelo
  if (teacher.current.type === 'repite' || teacher.current.type === 'pronuncia'){
    await new Promise(r=>setTimeout(r, 300));
    setLive('speak', '🔊 Escucha el modelo…');
    await speakSafe(teacher.current.expectAnswer, teacher.current.answerLang);
  }

  tbAvatar.classList.remove('talking');

  // 3) Ahora sí, escuchar
  await new Promise(r=>setTimeout(r, 400));
  startListening();
}

/* --- Terminar --- */
function endClass(){
  teacher.active = false;
  stopListening();
  clearLater();
  const total = teacher.ok + teacher.ko;
  tbQuestion.textContent = '¡Clase terminada! 🎉';
  tbFeedback.className = 'tb-feedback ok';
  tbFeedback.textContent = `Puntaje: ${teacher.ok} / ${total}`;
  setStatus('Clase finalizada');
  setLive('', '💤 En espera');
  speakSafe(`Muy bien. Terminaste la clase. Tuviste ${teacher.ok} aciertos de ${total}.`, 'es');
  btnStart.disabled = false;
  enableButtons(false);
  btnStop.disabled = true;
  tbManual.classList.remove('show');
}

/* --- Evaluar respuesta --- */
function evaluateAnswer(spoken){
  if (!teacher.current) return;
  stopListening();
  teacher.state = 'evaluating';
  const expected = teacher.current.expectAnswer;
  const sim = similarity(spoken, expected);
  let color, feedback;
  if (sim >= 0.85){ teacher.ok++; color='ok'; feedback = `✅ ¡Excelente! "${expected}"`; speakSafe(pick(['¡Muy bien!','¡Perfecto!','¡Correcto!','¡Excelente!']), 'es'); }
  else if (sim >= 0.6){ teacher.ok++; color='partial'; feedback = `🟡 Casi. Escuché "${spoken}", era "${expected}"`; speakSafe(`Casi. La respuesta correcta es ${expected}`, 'es'); }
  else { teacher.ko++; color='ko'; feedback = `❌ Era "${expected}". Dijiste "${spoken}"`; speakSafe(`No exactamente. La respuesta correcta es ${expected}`, 'es'); }
  tbFeedback.className = 'tb-feedback ' + color;
  tbFeedback.textContent = feedback;
  refreshTeacherUI();
  setStatus(color==='ok'?'✅ Acierto':(color==='ko'?'❌ Fallo':'🟡 Casi'));
  advanceAfterFeedback();
}
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

/* --- Abrir/cerrar panel --- */
document.getElementById('openTeacher').addEventListener('click', ()=>{ teacherBar.classList.toggle('open'); });

/* --- Atajos --- */
window.addEventListener('keydown', e=>{
  if (!teacherBar.classList.contains('open')) return;
  if (e.target.tagName==='INPUT'||e.target.tagName==='SELECT') return;
  if (e.key==='Enter' && teacher.active && teacher.state === 'listening'){ e.preventDefault(); startListening(); }
  if (e.key==='Escape' && !teacher.active) teacherBar.classList.remove('open');
});

/* --- Init --- */
renderTab();
refreshProgressUI();
if ('speechSynthesis' in window){ speechSynthesis.getVoices(); }

})();
</script>
