
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1115">
<meta name="author" content="OmniClase">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Pizarra OmniClase</title>
<style>
  :root{
    --bg:#fff; --fg:#111; --panel:rgba(255,255,255,.92);
    --border:rgba(0,0,0,.08); --accent:#007aff; --accent2:#ff3b30;
    --shadow:0 6px 24px rgba(0,0,0,.12);
    --fs-ui:    clamp(12px, 1.1vw + 0.3vh, 22px);
    --fs-small: clamp(10px, 0.9vw + 0.2vh, 18px);
    --fs-btn:   clamp(14px, 1.4vw + 0.4vh, 28px);
    --pad-ui:   clamp(4px, 0.5vw + 0.3vh, 14px);
    --gap-ui:   clamp(3px, 0.4vw + 0.2vh, 10px);
    --radius:   clamp(8px, 0.7vw + 0.4vh, 18px);
    --btn-min:  clamp(30px, 3vw + 1.4vh, 60px);
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-l: env(safe-area-inset-left, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
  }
  body.dark{
    --bg:#0f1115; --fg:#f2f2f2; --panel:rgba(26,29,36,.92);
    --border:rgba(255,255,255,.12); --shadow:0 6px 24px rgba(0,0,0,.5);
  }
  *{margin:0;padding:0;box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;
    -webkit-touch-callout:none;}
  html,body{
    height:100%;width:100%;overflow:hidden;overscroll-behavior:none;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    font-size:var(--fs-ui);
    background:var(--bg);color:var(--fg);
    -webkit-text-size-adjust:100%;
    text-size-adjust:100%;
  }
  canvas{display:block;position:fixed;inset:0;touch-action:none;cursor:crosshair;}

  #toolbar{
    position:fixed;
    top:calc(6px + var(--safe-t));
    left:calc(6px + var(--safe-l));
    right:calc(6px + var(--safe-r));
    z-index:20;
    display:flex;flex-wrap:wrap;gap:var(--gap-ui);align-items:center;
    background:var(--panel);
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
    padding:var(--pad-ui);border-radius:var(--radius);
    box-shadow:var(--shadow);border:1px solid var(--border);
    transition:transform .25s ease, opacity .25s ease;
    max-height:calc(100vh - 20px);overflow-y:auto;
    scrollbar-width:thin;
  }
  #toolbar.collapsed{
    transform:translateY(calc(-100% - var(--safe-t) - 6px));
    opacity:0;pointer-events:none;
  }
  #toolbar .group{
    display:flex;gap:calc(var(--gap-ui) * .7);align-items:center;
    padding-right:var(--gap-ui);
    border-right:1px solid var(--border);
    flex-wrap:wrap;
  }
  #toolbar .group:last-child{border-right:none;padding-right:0;}

  button,select,input[type="text"]{
    font:inherit;font-size:var(--fs-btn);
    min-width:var(--btn-min);min-height:var(--btn-min);
    padding:calc(var(--pad-ui) * .7) calc(var(--pad-ui) * 1.1);
    border:1px solid var(--border);border-radius:calc(var(--radius) * .7);
    background:transparent;color:var(--fg);cursor:pointer;
    touch-action:manipulation;line-height:1;
    transition:background .15s,transform .1s;
    display:inline-flex;align-items:center;justify-content:center;
  }
  button:active{transform:scale(.94);}
  button:hover,select:hover{background:rgba(127,127,127,.12);}
  button.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  button.ghost{background:rgba(127,127,127,.08);}
  input[type="color"]{
    width:var(--btn-min);height:var(--btn-min);padding:2px;
    border:none;background:none;cursor:pointer;border-radius:calc(var(--radius) * .7);
  }
  input[type="range"]{width:clamp(60px,8vw,180px);accent-color:var(--accent);min-height:var(--btn-min);}
  .palette{display:flex;gap:calc(var(--gap-ui) * .5);flex-wrap:wrap;}
  .swatch{
    width:calc(var(--btn-min) * .55);height:calc(var(--btn-min) * .55);
    border-radius:50%;border:2px solid transparent;cursor:pointer;
    transition:transform .1s;
  }
  .swatch:active{transform:scale(.9);}
  .swatch.sel{border-color:var(--fg);}

  #menuToggle{
    position:fixed;
    top:calc(8px + var(--safe-t));
    right:calc(8px + var(--safe-r));
    z-index:25;
    background:var(--panel);
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
    border:1px solid var(--border);
    border-radius:calc(var(--radius) * .8);
    width:var(--btn-min);height:var(--btn-min);
    display:none;align-items:center;justify-content:center;
    box-shadow:var(--shadow);
    font-size:var(--fs-btn);
  }

  #status{
    position:fixed;
    bottom:calc(8px + var(--safe-b));
    left:calc(8px + var(--safe-l));
    z-index:20;
    background:var(--panel);padding:calc(var(--pad-ui)*.6) calc(var(--pad-ui)*1.1);
    border-radius:calc(var(--radius)*.7);
    font-size:var(--fs-small);opacity:.85;pointer-events:none;
    border:1px solid var(--border);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    max-width:60vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  #transcript{
    position:fixed;
    bottom:calc(8px + var(--safe-b));
    right:calc(8px + var(--safe-r));
    z-index:20;width:min(340px, 60vw);max-height:38vh;overflow:auto;
    background:var(--panel);padding:calc(var(--pad-ui)*1.2) calc(var(--pad-ui)*1.4);
    border-radius:var(--radius);font-size:var(--fs-small);
    border:1px solid var(--border);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    display:none;
  }
  #transcript h4{font-size:var(--fs-small);opacity:.6;margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em;}
  #transcript p{margin:4px 0;line-height:1.4;}

  #watermark{
    position:fixed;inset:0;z-index:15;pointer-events:none;
    display:flex;align-items:center;justify-content:center;
    font-size:clamp(40px, 8vw, 200px);
    color:rgba(127,127,127,.06);
    font-weight:900;letter-spacing:.1em;
    transform:rotate(-25deg);
    user-select:none;
  }

  #lockScreen{
    position:fixed;inset:0;z-index:9999;display:none;
    background:var(--bg);color:var(--fg);
    align-items:center;justify-content:center;text-align:center;
    padding:20px;font-size:var(--fs-ui);
  }
  #lockScreen.on{display:flex;}
  #lockScreen div{max-width:520px;line-height:1.6;}

  @media (max-width:640px){
    #toolbar{gap:3px;padding:4px;}
    #toolbar .group{padding-right:3px;}
    .hide-xs{display:none !important;}
    #menuToggle{display:flex;}
    #toolbar{flex-wrap:wrap;max-height:70vh;}
  }
  @media (max-width:900px) and (orientation:landscape){
    #toolbar{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;}
    #toolbar .group{flex-wrap:nowrap;}
  }
  @media (min-width:641px) and (max-width:1024px){
    .hide-md{display:none !important;}
  }
  @media (min-width:2200px){
    #toolbar{max-width:90vw;margin:0 auto;left:5vw;right:5vw;}
    #watermark{font-size:clamp(120px, 12vw, 320px);}
  }
  @media (min-width:3600px){
    #toolbar{max-width:80vw;left:10vw;right:10vw;padding:calc(var(--pad-ui)*1.4);}
    #watermark{font-size:clamp(200px, 14vw, 480px);}
  }
  @supports (padding:env(safe-area-inset-top)){
    #toolbar{margin-top:var(--safe-t);}
  }
  @media (prefers-color-scheme:dark){
    body:not(.light-forced){
      --bg:#0f1115;--fg:#f2f2f2;--panel:rgba(26,29,36,.92);
      --border:rgba(255,255,255,.12);--shadow:0 6px 24px rgba(0,0,0,.5);
    }
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important;}
  }
</style>
</head>
<body>
<canvas id="board"></canvas>
<div id="watermark" aria-hidden="true">OMNICLASE</div>

<button id="menuToggle" title="Menú">☰</button>

<div id="toolbar">
  <div class="group">
    <button id="t-pen" class="active" title="Lápiz (P)">✏️</button>
    <button id="t-high" title="Resaltador (H)">🖍️</button>
    <button id="t-eraser" title="Borrador (E)">🧽</button>
    <button id="t-line" title="Línea (L)" class="hide-xs">╱</button>
    <button id="t-rect" title="Rectángulo (R)" class="hide-xs">▭</button>
    <button id="t-circle" title="Círculo (O)" class="hide-xs">◯</button>
    <button id="t-arrow" title="Flecha (A)" class="hide-xs">→</button>
    <button id="t-text" title="Texto (T)">T</button>
  </div>

  <div class="group">
    <input type="color" id="color" value="#111111">
    <div class="palette" id="palette"></div>
  </div>

  <div class="group">
    <input type="range" id="size" min="1" max="40" value="3" title="Grosor">
    <span id="sizeLabel" style="font-size:var(--fs-small);opacity:.6;min-width:2em;text-align:center;">3</span>
  </div>

  <div class="group">
    <select id="bg" title="Fondo">
      <option value="blank">En blanco</option>
      <option value="grid">Cuadrícula</option>
      <option value="lines">Líneas</option>
      <option value="dots">Puntos</option>
      <option value="graph">Milimétrico</option>
      <option value="music">Música</option>
    </select>
  </div>

  <div class="group">
    <button id="undo" title="Deshacer (Ctrl+Z)">↩️</button>
    <button id="redo" title="Rehacer (Ctrl+Y)">↪️</button>
    <button id="clear" title="Limpiar">🗑️</button>
  </div>

  <div class="group">
    <button id="prev" title="Anterior">◀</button>
    <span id="pageLabel" style="font-size:var(--fs-small);min-width:3em;text-align:center;">1 / 1</span>
    <button id="next" title="Siguiente">▶</button>
    <button id="addPage" title="Nueva página">＋</button>
  </div>

  <div class="group">
    <button id="mic" title="Dictado">🎙️</button>
    <button id="speak" title="Leer" class="hide-xs">🔊</button>
    <button id="save" title="Guardar PNG">💾</button>
    <button id="saveJson" title="Proyecto" class="hide-md">📁</button>
    <button id="loadJson" title="Abrir" class="hide-md">📂</button>
    <button id="full" title="Pantalla completa">⛶</button>
    <button id="theme" title="Modo oscuro">🌗</button>
  </div>
</div>

<div id="status">Listo · Pizarra OmniClase</div>
<div id="transcript"><h4>Transcripción</h4><div id="transcriptBody"></div></div>
<input type="file" id="fileInput" accept=".json" style="display:none">
<div id="lockScreen"><div>
  <h2>⚠️ Contenido protegido</h2>
  <p>Se ha detectado una herramienta de inspección abierta. Cierra las herramientas de desarrollador para continuar usando <b>OmniClase</b>.</p>
  <p style="opacity:.6;margin-top:12px;font-size:.85em">© OmniClase · Todos los derechos reservados</p>
</div></div>

<script>

   Reproducción, copia o redistribución no autorizada prohibida.
   ============================================================= */
(function(){
'use strict';

/* ============================================================
   ⚙️  CONFIGURACIÓN DE PROTECCIÓN
   ============================================================
   👉 CAMBIA ESTA LISTA por TUS dominios reales.
      Ejemplos:
        - GitHub Pages:  'tuusuario.github.io'
        - Netlify:       'tuapp.netlify.app'
        - Vercel:        'tuapp.vercel.app'
        - Dominio propio:'tudominio.com', 'www.tudominio.com'
        - Local (pruebas): 'localhost', '127.0.0.1', ''
   ============================================================ */
const DOMINIOS_AUTORIZADOS = [
  'tuusuario.github.io',   // 👈 CAMBIA ESTO por tu usuario de GitHub
  'localhost',
  '127.0.0.1',
  ''                       // permite abrir el archivo local (file://)
];

/* ------------------------------------------------------------
   Si quieres PERMITIR TODO (para pruebas), deja el array vacío:
   const DOMINIOS_AUTORIZADOS = [];
   ------------------------------------------------------------ */

const BLOQUEAR_CLIC_DERECHO = true;
const BLOQUEAR_DEVTOOLS      = true;
const BLOQUEAR_ATAJOS        = true;
const MOSTRAR_MARCA_AGUA     = true;

/* ============================================================
   VERIFICACIÓN DE DOMINIO — primera barrera
   ============================================================ */
(function checkDominio(){
  if (DOMINIOS_AUTORIZADOS.length === 0) return;
  const host = location.hostname;
  if (!DOMINIOS_AUTORIZADOS.includes(host)){
    document.documentElement.innerHTML =
      '<head><meta charset="utf-8"><title>Acceso bloqueado</title></head>' +
      '<body style="margin:0;display:flex;align-items:center;justify-content:center;' +
      'min-height:100vh;font-family:system-ui,sans-serif;background:#0f1115;color:#f2f2f2;text-align:center;padding:24px">' +
      '<div style="max-width:560px;line-height:1.7">' +
      '<div style="font-size:64px;margin-bottom:12px">🔒</div>' +
      '<h1 style="margin:0 0 12px;font-size:26px">Acceso no autorizado</h1>' +
      '<p>Esta copia de <b>OmniClase</b> no está licenciada para el dominio:</p>' +
      '<p style="background:#ffffff10;padding:10px 16px;border-radius:10px;display:inline-block;' +
      'font-family:monospace;margin:12px 0">' + host + '</p>' +
      '<p style="opacity:.6;font-size:13px;margin-top:20px">' +
      'Si eres el propietario, autoriza tu dominio en <code>DOMINIOS_AUTORIZADOS</code>.<br>' +
      '© OmniClase · Todos los derechos reservados</p>' +
      '</div></body>';
    throw new Error('Dominio no autorizado: ' + host);
  }
})();

/* ============================================================
   BLOQUEO DE CLIC DERECHO Y SELECCIÓN
   ============================================================ */
if (BLOQUEAR_CLIC_DERECHO){
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('dragstart',   e => e.preventDefault());
  document.addEventListener('selectstart', e => {
    if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') e.preventDefault();
  });
  document.addEventListener('copy', e => e.preventDefault());
  document.addEventListener('cut',  e => e.preventDefault());
}

/* ============================================================
   BLOQUEO DE ATAJOS DE DEVTOOLS
   ============================================================ */
if (BLOQUEAR_ATAJOS){
  document.addEventListener('keydown', e => {
    if (e.key === 'F12'){ e.preventDefault(); return false; }
    if ((e.ctrlKey || e.metaKey) && e.shiftKey &&
        ['I','J','C','K','i','j','c','k'].includes(e.key)){
      e.preventDefault(); return false;
    }
    if ((e.ctrlKey || e.metaKey) && (e.key === 'u' || e.key === 'U')){
      e.preventDefault(); return false;
    }
    if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S')){
      e.preventDefault(); return false;
    }
  }, true);
}

/* ============================================================
   DETECCIÓN DE DEVTOOLS
   ============================================================ */
if (BLOQUEAR_DEVTOOLS){
  const lockScreen = document.getElementById('lockScreen');
  let devtoolsOpen = false;
  const umbral = 160;

  const check = () => {
    const wDelta = window.outerWidth - window.innerWidth;
    const hDelta = window.outerHeight - window.innerHeight;
    const sospechoso = wDelta > umbral || hDelta > umbral;
    if (sospechoso !== devtoolsOpen){
      devtoolsOpen = sospechoso;
      lockScreen.classList.toggle('on', devtoolsOpen);
    }
  };
  setInterval(check, 900);

  const trampa = /./;
  trampa.toString = function(){
    lockScreen.classList.add('on');
    return '';
  };
  try { console.log('%c', trampa); } catch(e){}
}

/* ============================================================
   MARCA DE AGUA
   ============================================================ */
if (!MOSTRAR_MARCA_AGUA){
  const wm = document.getElementById('watermark');
  if (wm) wm.remove();
}

/* ============================================================
   OFUSCACIÓN BÁSICA
   ============================================================ */
const _0x1a = 'board', _0x2b = 'getContext', _0x3c = '2d';

/* ============================================================
   APLICACIÓN PRINCIPAL
   ============================================================ */
const canvas = document.getElementById(_0x1a);
const ctx = canvas[_0x2b](_0x3c);
const statusEl = document.getElementById('status');
const transcriptEl = document.getElementById('transcript');
const transcriptBody = document.getElementById('transcriptBody');
const sizeLabel = document.getElementById('sizeLabel');
const pageLabel = document.getElementById('pageLabel');
const toolbar = document.getElementById('toolbar');
const menuToggle = document.getElementById('menuToggle');

let dpr = window.devicePixelRatio || 1;
let W = 0, H = 0;

function newPage(){ return { strokes: [], bg: 'blank' }; }

const state = {
  tool: 'pen',
  color: '#111111',
  size: 3,
  bg: 'blank',
  dark: false,
  pages: [newPage()],
  pageIndex: 0,
  undoStack: [],
  redoStack: []
};

function current(){ return state.pages[state.pageIndex]; }

/* ---------- RESIZE ---------- */
let resizeTimer = null;
function resize(){
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    dpr = window.devicePixelRatio || 1;
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    redraw();
  }, 80);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));
if (window.visualViewport){
  window.visualViewport.addEventListener('resize', resize);
}

/* ---------- FONDOS ---------- */
function drawBackground(){
  const bg = state.bg;
  ctx.save();
  ctx.fillStyle = state.dark ? '#0f1115' : '#ffffff';
  ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = state.dark ? 'rgba(255,255,255,.08)' : 'rgba(0,0,0,.08)';
  ctx.fillStyle   = state.dark ? 'rgba(255,255,255,.18)' : 'rgba(0,0,0,.18)';
  ctx.lineWidth = 1;

  const base = Math.max(24, Math.min(W, H) / 28);

  if (bg === 'grid'){
    for (let x = 0; x < W; x += base){ ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for (let y = 0; y < H; y += base){ ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  } else if (bg === 'lines'){
    for (let y = base; y < H; y += base){ ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  } else if (bg === 'dots'){
    for (let x = base; x < W; x += base)
      for (let y = base; y < H; y += base){ ctx.beginPath(); ctx.arc(x, y, 1.2, 0, Math.PI*2); ctx.fill(); }
  } else if (bg === 'graph'){
    const s = base / 2;
    ctx.lineWidth = .6;
    for (let x = 0; x < W; x += s){ ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for (let y = 0; y < H; y += s){ ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
    ctx.lineWidth = 1.2;
    for (let x = 0; x < W; x += base*5){ ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for (let y = 0; y < H; y += base*5){ ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  } else if (bg === 'music'){
    const gap = base * .9;
    for (let i = 0; i < 6; i++){
      const y = H * .25 + i * gap;
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
  }
  ctx.restore();
}

/* ---------- DIBUJO ---------- */
function drawStroke(s){
  if (s.type === 'path')   return drawPath(s);
  if (s.type === 'line')   return drawLine(s);
  if (s.type === 'rect')   return drawRect(s);
  if (s.type === 'circle') return drawCircle(s);
  if (s.type === 'arrow')  return drawArrow(s);
  if (s.type === 'text')   return drawText(s);
}

function applyStyle(s){
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  const factor = Math.max(.5, Math.min(W, H) / 800);
  const lw = s.size * factor;
  if (s.tool === 'eraser'){
    ctx.strokeStyle = state.dark ? '#0f1115' : '#ffffff';
    ctx.lineWidth = lw * 3;
    ctx.globalAlpha = 1;
  } else if (s.tool === 'high'){
    ctx.strokeStyle = s.color;
    ctx.lineWidth = lw * 4;
    ctx.globalAlpha = .35;
  } else {
    ctx.strokeStyle = s.color;
    ctx.lineWidth = lw;
    ctx.globalAlpha = 1;
  }
}

function drawPath(s){
  ctx.save(); applyStyle(s);
  ctx.beginPath();
  const p = s.points;
  if (p.length === 1){
    ctx.arc(p[0].x, p[0].y, ctx.lineWidth/2, 0, Math.PI*2);
    ctx.fillStyle = ctx.strokeStyle; ctx.fill();
  } else {
    ctx.moveTo(p[0].x, p[0].y);
    for (let i = 1; i < p.length - 1; i++){
      const mx = (p[i].x + p[i+1].x) / 2;
      const my = (p[i].y + p[i+1].y) / 2;
      ctx.quadraticCurveTo(p[i].x, p[i].y, mx, my);
    }
    ctx.lineTo(p[p.length-1].x, p[p.length-1].y);
    ctx.stroke();
  }
  ctx.restore();
}
function drawLine(s){ ctx.save(); applyStyle(s); ctx.beginPath(); ctx.moveTo(s.x0,s.y0); ctx.lineTo(s.x1,s.y1); ctx.stroke(); ctx.restore(); }
function drawRect(s){
  ctx.save(); applyStyle(s);
  ctx.strokeRect(Math.min(s.x0,s.x1), Math.min(s.y0,s.y1), Math.abs(s.x1-s.x0), Math.abs(s.y1-s.y0));
  ctx.restore();
}
function drawCircle(s){
  ctx.save(); applyStyle(s);
  ctx.beginPath();
  ctx.ellipse((s.x0+s.x1)/2,(s.y0+s.y1)/2, Math.abs(s.x1-s.x0)/2, Math.abs(s.y1-s.y0)/2, 0, 0, Math.PI*2);
  ctx.stroke(); ctx.restore();
}
function drawArrow(s){
  ctx.save(); applyStyle(s);
  const dx=s.x1-s.x0, dy=s.y1-s.y0;
  const ang=Math.atan2(dy,dx), len=Math.hypot(dx,dy);
  const head=Math.min(ctx.lineWidth*6, len*.3);
  ctx.beginPath(); ctx.moveTo(s.x0,s.y0); ctx.lineTo(s.x1,s.y1); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(s.x1,s.y1); ctx.lineTo(s.x1-head*Math.cos(ang-Math.PI/7), s.y1-head*Math.sin(ang-Math.PI/7));
  ctx.moveTo(s.x1,s.y1); ctx.lineTo(s.x1-head*Math.cos(ang+Math.PI/7), s.y1-head*Math.sin(ang+Math.PI/7));
  ctx.stroke(); ctx.restore();
}
function drawText(s){
  ctx.save();
  ctx.fillStyle = s.color;
  const fs = Math.max(14, s.size * 8 + 12) * Math.max(.7, Math.min(W,H)/900);
  ctx.font = '600 ' + fs + 'px system-ui, sans-serif';
  ctx.textBaseline = 'top';
  s.text.split('\n').forEach((ln,i) => ctx.fillText(ln, s.x0, s.y0 + i*fs*1.2));
  ctx.restore();
}

function redraw(){
  drawBackground();
  for (const st of current().strokes) drawStroke(st);
}

/* ---------- POINTER ---------- */
let drawing = false, activePointer = null, penActive = false, tempStroke = null;

function getPos(e){
  const r = canvas.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top, pressure: e.pressure || .5 };
}

canvas.addEventListener('pointerdown', e => {
  if (e.pointerType === 'touch' && penActive) return;
  if (e.pointerType === 'pen') penActive = true;
  if (activePointer !== null) return;
  e.preventDefault();
  activePointer = e.pointerId;
  try { canvas.setPointerCapture(e.pointerId); } catch(_){}
  const p = getPos(e);
  const base = { tool: state.tool, color: state.color, size: state.size, pointerType: e.pointerType };

  if (state.tool === 'text'){
    const text = prompt('Texto:');
    if (text && text.trim()) pushStroke({ type:'text', x0:p.x, y0:p.y, text:text.trim(), color:state.color, size:state.size });
    activePointer = null;
    return;
  }
  if (state.tool === 'pen' || state.tool === 'high' || state.tool === 'eraser'){
    tempStroke = { type:'path', ...base, points:[p] };
  } else {
    tempStroke = { type: state.tool, ...base, x0:p.x, y0:p.y, x1:p.x, y1:p.y };
  }
  drawing = true;
}, { passive:false });

canvas.addEventListener('pointermove', e => {
  if (!drawing || e.pointerId !== activePointer || !tempStroke) return;
  e.preventDefault();
  const p = getPos(e);
  if (tempStroke.type === 'path'){
    tempStroke.points.push(p);
    redraw(); drawStroke(tempStroke);
  } else {
    tempStroke.x1 = p.x; tempStroke.y1 = p.y;
    redraw(); drawStroke(tempStroke);
  }
}, { passive:false });

function endPointer(e){
  if (e.pointerId !== activePointer) return;
  if (e.pointerType === 'pen') penActive = false;
  if (tempStroke && drawing){
    if (tempStroke.type === 'path' && tempStroke.points.length < 2){
      tempStroke.points.push({ ...tempStroke.points[0] });
    }
    pushStroke(tempStroke);
  }
  drawing = false; activePointer = null; tempStroke = null;
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);

/* ---------- HISTORIAL ---------- */
function pushStroke(stroke){
  current().strokes.push(stroke);
  state.undoStack.push({ page: state.pageIndex, action:'add', stroke });
  state.redoStack = [];
  redraw();
  autosave();
}
function undo(){
  const last = state.undoStack.pop();
  if (!last) return;
  if (last.action === 'add'){
    const pg = state.pages[last.page];
    const i = pg.strokes.lastIndexOf(last.stroke);
    if (i >= 0){ pg.strokes.splice(i,1); state.redoStack.push({ page:last.page, stroke:last.stroke, index:i }); }
  } else if (last.action === 'clear'){
    state.pages[last.page].strokes = last.strokes;
    state.redoStack.push({ page:last.page, action:'clear' });
  }
  redraw(); autosave();
}
function redo(){
  const last = state.redoStack.pop();
  if (!last) return;
  if (last.stroke){
    state.pages[last.page].strokes.splice(last.index, 0, last.stroke);
    state.undoStack.push({ page:last.page, action:'add', stroke:last.stroke });
  } else if (last.action === 'clear'){
    const prev = state.pages[last.page].strokes;
    state.pages[last.page].strokes = [];
    state.undoStack.push({ page:last.page, action:'clear', strokes:prev });
  }
  redraw(); autosave();
}

/* ---------- UI ---------- */
const buttons = {
  pen: document.getElementById('t-pen'),
  high: document.getElementById('t-high'),
  eraser: document.getElementById('t-eraser'),
  line: document.getElementById('t-line'),
  rect: document.getElementById('t-rect'),
  circle: document.getElementById('t-circle'),
  arrow: document.getElementById('t-arrow'),
  text: document.getElementById('t-text')
};

function setTool(t){
  state.tool = t;
  Object.entries(buttons).forEach(([k,b]) => b.classList.toggle('active', k === t));
  canvas.style.cursor = t === 'text' ? 'text' : 'crosshair';
  status(t.toUpperCase() + ' · color ' + state.color + ' · grosor ' + state.size);
}
Object.entries(buttons).forEach(([k,b]) => b.addEventListener('click', () => setTool(k)));

document.getElementById('color').addEventListener('input', e => {
  state.color = e.target.value;
  document.querySelectorAll('.swatch').forEach(x => x.classList.remove('sel'));
  setTool(state.tool);
});

const paletteColors = ['#111111','#ff3b30','#ff9500','#ffcc00','#34c759','#007aff','#5856d6','#af52de','#ff2d55'];
const paletteEl = document.getElementById('palette');
paletteColors.forEach(c => {
  const s = document.createElement('div');
  s.className = 'swatch';
  s.style.background = c;
  s.addEventListener('click', () => {
    state.color = c;
    document.getElementById('color').value = c;
    document.querySelectorAll('.swatch').forEach(x => x.classList.remove('sel'));
    s.classList.add('sel');
    setTool(state.tool);
  });
  paletteEl.appendChild(s);
});
paletteEl.firstChild.classList.add('sel');

document.getElementById('size').addEventListener('input', e => {
  state.size = parseInt(e.target.value);
  sizeLabel.textContent = state.size;
});
document.getElementById('bg').addEventListener('change', e => {
  state.bg = e.target.value; current().bg = e.target.value;
  redraw(); autosave();
});
document.getElementById('undo').addEventListener('click', undo);
document.getElementById('redo').addEventListener('click', redo);
document.getElementById('clear').addEventListener('click', () => {
  if (!confirm('¿Limpiar la página?')) return;
  const prev = current().strokes;
  current().strokes = [];
  state.undoStack.push({ page: state.pageIndex, action:'clear', strokes: prev });
  state.redoStack = [];
  redraw(); autosave();
});

function updatePageLabel(){ pageLabel.textContent = (state.pageIndex+1) + ' / ' + state.pages.length; }
document.getElementById('prev').addEventListener('click', () => {
  if (state.pageIndex > 0){ state.pageIndex--; state.undoStack = []; state.redoStack = []; updatePageLabel(); redraw(); }
});
document.getElementById('next').addEventListener('click', () => {
  if (state.pageIndex < state.pages.length-1){ state.pageIndex++; state.undoStack = []; state.redoStack = []; updatePageLabel(); redraw(); }
});
document.getElementById('addPage').addEventListener('click', () => {
  state.pages.push(newPage());
  state.pageIndex = state.pages.length-1;
  state.undoStack = []; state.redoStack = [];
  updatePageLabel(); redraw(); autosave();
});

/* ---------- EXPORTAR ---------- */
document.getElementById('save').addEventListener('click', () => {
  const link = document.createElement('a');
  link.download = 'omniclase-p' + (state.pageIndex+1) + '.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
});
document.getElementById('saveJson').addEventListener('click', () => {
  const data = JSON.stringify({ version:2, pages: state.pages, pageIndex: state.pageIndex, bg: state.bg });
  const blob = new Blob([data], { type:'application/json' });
  const link = document.createElement('a');
  link.download = 'omniclase.json';
  link.href = URL.createObjectURL(blob);
  link.click();
});
const fileInput = document.getElementById('fileInput');
document.getElementById('loadJson').addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = ev => {
    try {
      const d = JSON.parse(ev.target.result);
      state.pages = d.pages || [newPage()];
      state.pageIndex = d.pageIndex || 0;
      state.bg = d.bg || 'blank';
      document.getElementById('bg').value = state.bg;
      state.undoStack = []; state.redoStack = [];
      updatePageLabel(); redraw(); status('Proyecto cargado');
    } catch(_){ alert('Archivo inválido'); }
  };
  r.readAsText(f);
  fileInput.value = '';
});

/* ---------- VOZ ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null, listening = false;
document.getElementById('mic').addEventListener('click', () => {
  if (!SR) return alert('Reconocimiento de voz no soportado. Usa Chrome o Edge.');
  if (listening){ recognition.stop(); return; }
  recognition = new SR();
  recognition.lang = 'es-ES';
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.onstart = () => {
    listening = true;
    document.getElementById('mic').classList.add('active');
    transcriptEl.style.display = 'block';
    status('Escuchando…');
  };
  recognition.onresult = e => {
    let txt = '';
    for (let i = e.resultIndex; i < e.results.length; i++){
      if (e.results[i].isFinal) txt += e.results[i][0].transcript;
    }
    if (txt){
      const p = document.createElement('p');
      p.textContent = '• ' + txt.trim();
      transcriptBody.appendChild(p);
      transcriptBody.scrollTop = transcriptBody.scrollHeight;
    }
  };
  recognition.onerror = () => status('Error de micrófono');
  recognition.onend = () => {
    listening = false;
    document.getElementById('mic').classList.remove('active');
    status('Dictado detenido');
  };
  recognition.start();
});
document.getElementById('speak').addEventListener('click', () => {
  const t = transcriptBody.innerText.trim();
  if (!t) return alert('Sin transcripción para leer.');
  const u = new SpeechSynthesisUtterance(t);
  u.lang = 'es-ES';
  speechSynthesis.speak(u);
});

/* ---------- PANTALLA / TEMA ---------- */
document.getElementById('full').addEventListener('click', () => {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
  else document.exitFullscreen?.();
});
document.getElementById('theme').addEventListener('click', () => {
  state.dark = !state.dark;
  document.body.classList.toggle('dark', state.dark);
  redraw();
});

/* ---------- MENÚ COLAPSABLE ---------- */
menuToggle.addEventListener('click', () => {
  toolbar.classList.toggle('collapsed');
  menuToggle.textContent = toolbar.classList.contains('collapsed') ? '☰' : '✕';
});
if (window.matchMedia('(max-width:640px)').matches){
  toolbar.addEventListener('click', e => {
    if (e.target.tagName === 'BUTTON' && !e.target.closest('#toolbar .group:last-child')){
      setTimeout(() => toolbar.classList.add('collapsed'), 150);
      menuToggle.textContent = '☰';
    }
  });
}

/* ---------- TECLADO ---------- */
window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.ctrlKey || e.metaKey){
    if (e.key === 'z'){ e.preventDefault(); undo(); return; }
    if (e.key === 'y'){ e.preventDefault(); redo(); return; }
    return;
  }
  const map = { p:'pen', h:'high', e:'eraser', l:'line', r:'rect', o:'circle', a:'arrow', t:'text' };
  const k = e.key.toLowerCase();
  if (map[k]) setTool(map[k]);
});

/* ---------- STATUS ---------- */
let statusTimer = null;
function status(m){
  statusEl.textContent = m;
  clearTimeout(statusTimer);
  statusTimer = setTimeout(() => statusEl.textContent = 'Listo · Pizarra OmniClase', 2500);
}

/* ---------- AUTOSAVE ---------- */
function autosave(){
  try {
    localStorage.setItem('omniclase_v2', JSON.stringify({
      pages: state.pages, pageIndex: state.pageIndex, bg: state.bg, dark: state.dark
    }));
  } catch(_){}
}
function loadAutosave(){
  try {
    const raw = localStorage.getItem('omniclase_v2');
    if (!raw) return;
    const d = JSON.parse(raw);
    if (d.pages && d.pages.length){
      state.pages = d.pages;
      state.pageIndex = d.pageIndex || 0;
      state.bg = d.bg || 'blank';
      state.dark = !!d.dark;
      document.getElementById('bg').value = state.bg;
      document.body.classList.toggle('dark', state.dark);
    }
  } catch(_){}
}

/* ---------- INIT ---------- */
loadAutosave();
updatePageLabel();
setTool('pen');
resize();

/* ---------- MARCAS INVISIBLES ---------- */
const FIRMA = '©OmniClase-' + btoa(location.hostname + '|' + Date.now()).slice(0,16);
try { localStorage.setItem('_omniclase_sig', FIRMA); } catch(_){}
Object.defineProperty(window, '_omniclase', { value: FIRMA, writable:false });

})();
</script>
